name: Deploy secure write gateway

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy Worker
        shell: bash
        run: npx wrangler deploy --config worker/wrangler.toml | tee worker-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_AUTH_TOKEN_HASH: ${{ secrets.SITE_AUTH_TOKEN_HASH }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_PASSWORD_SALT: ${{ secrets.ADMIN_PASSWORD_SALT }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          GITHUB_DATA_TOKEN: ${{ secrets.PLANNER_DATA_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          ALLOWED_ORIGIN: ${{ vars.PAGES_ORIGIN }}
        run: |
          jq -n \
            --arg site "$SITE_AUTH_TOKEN_HASH" \
            --arg admin "$ADMIN_PASSWORD_HASH" \
            --arg salt "$ADMIN_PASSWORD_SALT" \
            --arg session "$ADMIN_SESSION_SECRET" \
            --arg token "$GITHUB_DATA_TOKEN" \
            --arg owner "$GITHUB_OWNER" \
            --arg repo "$GITHUB_REPO" \
            --arg origin "$ALLOWED_ORIGIN" \
            '{SITE_AUTH_TOKEN_HASH:$site,ADMIN_PASSWORD_HASH:$admin,ADMIN_PASSWORD_SALT:$salt,ADMIN_SESSION_SECRET:$session,GITHUB_DATA_TOKEN:$token,GITHUB_OWNER:$owner,GITHUB_REPO:$repo,ALLOWED_ORIGIN:$origin}' \
            > worker-secrets.json
          npx wrangler secret bulk worker-secrets.json --config worker/wrangler.toml
          rm -f worker-secrets.json
      - name: Connect and redeploy the frontend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' worker-deploy.log | tail -n 1)"
          test -n "$worker_url"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$worker_url/health" > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 2
          done
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f worker_api_url="$worker_url"
