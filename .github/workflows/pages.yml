name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
    inputs:
      worker_api_url:
        description: Secure Worker URL supplied by the Worker deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          WORKER_API_URL: ${{ inputs.worker_api_url || vars.WORKER_API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
